services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: politics_exam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - politics_exam_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d politics_exam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  politics_exam_data:
